name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          dotnet build src/Hma.LauncherBypass/Hma.LauncherBypass.csproj --configuration Release "-p:Version=$version" --output artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "artifacts/HMALauncherBypass-$env:GITHUB_REF_NAME.exe" "artifacts/HMALauncherBypass-$env:GITHUB_REF_NAME.exe.config" --verify-tag --generate-notes
